name: Sync Vexa Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Pull Vexa gateway from Docker Hub
        run: |
          docker pull vexaai/v012-gateway:v0.12.26

      - name: Tag image
        run: |
          docker tag \
            vexaai/v012-gateway:v0.12.26 \
            "${{ secrets.ACR_REGISTRY }}/needham1107/needham1107:v012-gateway-v0.12.26"

      - name: Push image to Aliyun ACR
        run: |
          docker push \
            "${{ secrets.ACR_REGISTRY }}/needham1107/needham1107:v012-gateway-v0.12.26"
